<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="peerjs.min.js"></script>
  <style>
    :root { --primary: #00ff41; --enemy: #ff4100; --bg: #050505; --glow: rgba(0,255,65,0.4); --font: 'Courier New', monospace; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); font-family: var(--font); height: 100vh; overflow: hidden; }
    .vault-border { border: 2px solid var(--primary); padding: 12px; box-shadow: 0 0 15px var(--glow), inset 0 0 10px var(--glow); display: flex; flex-direction: column; height: 100vh; width: 100%; background: radial-gradient(circle at center, #0a0a0a 0%, #050505 100%); transition: border-color 0.3s ease; }
    #lock-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    #lock-status { color: var(--primary); text-shadow: 0 0 8px var(--primary); margin-bottom: 20px; font-size: 14px; }
    input, textarea { background: #000; color: var(--primary); border: 1px solid var(--primary); padding: 8px; outline: none; font-family: var(--font); font-size: 10px; width: 100%; caret-color: var(--primary); }
    button { background: var(--primary); color: #000; font-weight: bold; border: none; padding: 10px; cursor: pointer; text-transform: uppercase; font-family: var(--font); }
    .small-btn { padding: 5px 10px; font-size: 9px; }
    #main-interface { display: none; flex-direction: column; height: 100%; width: 100%; }
    #nav-row { display: flex; gap: 5px; margin-bottom: 10px; border-bottom: 1px solid var(--primary); padding-bottom: 5px; }
    .nav-btn { flex: 1; background: none; border: 1px solid var(--primary); color: var(--primary); font-size: 9px; cursor: pointer; padding: 5px; }
    .nav-btn.active { background: var(--primary); color: #000; }
    .tab-content { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    #chat-window { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; color: var(--primary); }
    #message-container { width: 100%; display: flex; flex-direction: column; }
    .bubble { max-width: 85%; margin: 5px 0; padding: 8px; font-size: 10px; border: 1px solid; word-break: break-all; }
    .bubble.sent { align-self: flex-start; border-color: var(--primary); color: var(--primary); }
    .bubble.received { align-self: flex-end; border-color: var(--enemy); color: var(--enemy); }
    .bubble.system { color: var(--enemy); border-color: var(--enemy); font-style: italic; text-align: center; width: 100%; opacity: 0.8; }
    #user-footer { font-size: 9px; margin-top: 5px; text-align: center; opacity: 0.7; color: var(--primary); }
    #peer-header { font-size: 10px; text-align: center; margin-bottom: 5px; color: var(--primary); }
    #contact-list { margin-bottom: 10px; }
  </style>
</head>
<body>
<div class="vault-border" id="main-vault">
  <div id="lock-screen">
    <div id="lock-status">VAULT LOCKED</div>
    <input type="password" id="unlock-key" placeholder="ENTER ACCESS KEY">
    <button id="unlock-btn" style="margin-top:15px; width:80%;">AUTHORIZE</button>
  </div>
  <div id="main-interface">
    <div style="text-align:center; margin-bottom:10px; font-size:12px; font-weight:bold; letter-spacing:2px;">SPLASH & SQUASH</div>
    <div id="nav-row">
      <button class="nav-btn active" data-tab="chat-page">RADIO</button>
      <button class="nav-btn" data-tab="contact-page">CONTACTS</button>
      <button class="nav-btn" data-tab="override-page" style="color:var(--enemy); border-color:var(--enemy);">OVERRIDE</button>
    </div>
    <div id="chat-page" class="tab-content">
      <div id="peer-header">PEER: NONE</div>
      <div id="chat-window"><div id="message-container"></div></div>
      <textarea id="text" rows="2" placeholder="TRANSMIT..."></textarea>
      <button id="action-btn" style="margin-top:5px;">EXECUTE CLASH</button>
      <div id="user-footer">ID: INITIALIZING...</div>
    </div>
    <div id="contact-page" class="tab-content" style="display:none;">
      <div style="margin-bottom:10px;"><input type="text" id="peer-id-input" placeholder="MANUAL PEER ID" style="margin-bottom:5px;"><button id="connect-btn" class="small-btn" style="width:100%;">CONNECT</button></div>
      <div style="margin-bottom:10px;"><input type="text" id="con-name" placeholder="NAME" style="margin-bottom:5px;"><input type="text" id="con-id" placeholder="PEER ID" style="margin-bottom:5px;"><button id="add-contact" class="small-btn" style="width:100%;">STORE CONTACT</button></div>
      <div id="contact-list"></div>
    </div>
    <div id="override-page" class="tab-content" style="display:none;">
      <input type="text" id="my-custom-id" placeholder="CHANGE SYSTEM ID" style="margin-bottom:5px; border-color:var(--enemy); color:var(--enemy);">
      <button id="save-my-id" class="small-btn" style="width:100%; background:var(--enemy); margin-bottom:15px;">SET IDENTITY</button>
      <button id="lock-now-btn" class="small-btn" style="width:100%; background:var(--enemy); margin-bottom:15px;">LOCK VAULT</button>
      <button id="factory-reset" class="small-btn" style="width:100%; background:var(--enemy);">FACTORY RESET</button>
      <p style="color:var(--enemy); opacity:0.8; margin-top:10px; font-size:9px;">WARNING: SYSTEM REBOOT REQUIRED AFTER OVERRIDE</p>
    </div>
  </div>
</div>
<script src="renderer.js"></script>
</body>
</html>
